<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creator Hub — PixelVault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar"><div class="container nav-inner">
    <a href="/" class="brand">PixelVault</a><div class="nav-links" id="nav-links"></div>
  </div></nav>

  <div class="container" style="padding:40px 24px">
    <h1 class="section-title">Creator <span>Hub</span></h1>

    <div id="wallet"></div>

    <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap">
      <a href="/creator/upload" class="btn btn-primary">+ Upload Template</a>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="templates">My Templates</button>
      <button class="tab" data-tab="sales">Sales</button>
    </div>

    <div id="tab-templates"></div>
    <div id="tab-sales" class="hidden"></div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    (async () => {
      const user = await getCurrentUser();
      if (!user || user.role !== 'creator') { location.href = '/login'; return; }
      if (user.status !== 'active') { location.href = '/pending'; return; }

      // Wallet
      const w = await api('/creator/wallet');
      document.getElementById('wallet').innerHTML = `
        <div class="wallet-card">
          <h3>Available Balance</h3>
          <div class="big">${formatKES(w.balance)}</div>
          <div class="sub">Total earned: ${formatKES(w.totalEarned)} · Withdrawn: ${formatKES(w.totalWithdrawn)}</div>
          <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
            <input id="w-amount" type="number" placeholder="Amount" style="padding:10px;border-radius:8px;border:none;font-family:inherit" />
            <input id="w-phone" placeholder="M-Pesa phone" style="padding:10px;border-radius:8px;border:none;font-family:inherit" />
            <button class="btn" style="background:#0a0a0a;color:#fff" id="w-btn">Withdraw</button>
          </div>
          <div id="w-msg" style="margin-top:8px;font-size:0.85rem"></div>
        </div>
      `;
      document.getElementById('w-btn').addEventListener('click', async () => {
        const amount = document.getElementById('w-amount').value;
        const phone = document.getElementById('w-phone').value;
        const m = document.getElementById('w-msg');
        try {
          await api('/creator/withdraw', { method: 'POST', body: JSON.stringify({ amount, phone }) });
          m.innerHTML = '<span style="color:#052e16">✅ Withdrawal requested</span>';
          setTimeout(() => location.reload(), 1200);
        } catch (err) { m.innerHTML = `<span style="color:#7f1d1d">${escapeHtml(err.message)}</span>`; }
      });

      // Templates
      async function loadTemplates() {
        const t = await api('/creator/templates');
        const box = document.getElementById('tab-templates');
        if (!t.length) { box.innerHTML = `<div class="empty">No templates yet. <a href="/creator/upload" style="color:var(--primary)">Upload your first</a></div>`; return; }
        box.innerHTML = t.map(x => `
          <div class="order-row">
            <img src="${x.previewImage}" />
            <div class="info">
              <h4>${escapeHtml(x.title)}</h4>
              <p>${escapeHtml(x.category)} · ${formatKES(x.price)} · ${x.sales} sales</p>
            </div>
            <span class="badge badge-${x.active ? 'active' : 'suspended'}">${x.active ? 'active' : 'hidden'}</span>
            <button class="btn btn-danger btn-sm" data-del="${x._id}">Delete</button>
          </div>
        `).join('');
        box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async (e) => {
          if (!confirm('Delete?')) return;
          await api('/creator/templates/' + e.target.dataset.del, { method: 'DELETE' });
          loadTemplates();
        }));
      }
      loadTemplates();

      // Sales
      async function loadSales() {
        const s = await api('/creator/sales');
        const box = document.getElementById('tab-sales');
        if (!s.length) { box.innerHTML = `<div class="empty">No sales yet.</div>`; return; }
        box.innerHTML = s.map(o => `
          <div class="order-row">
            <img src="${o.template?.previewImage || ''}" />
            <div class="info">
              <h4>${escapeHtml(o.template?.title || 'Template')}</h4>
              <p>By ${escapeHtml(o.user?.name || 'Customer')} · ${new Date(o.paidAt).toLocaleDateString()}</p>
              <p style="font-size:0.75rem">Receipt: ${escapeHtml(o.mpesaReceipt || '-')}</p>
            </div>
            <span style="color:var(--primary);font-weight:800">+${formatKES(o.creatorEarnings)}</span>
          </div>
        `).join('');
      }

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const name = tab.dataset.tab;
          document.getElementById('tab-templates').classList.toggle('hidden', name !== 'templates');
          document.getElementById('tab-sales').classList.toggle('hidden', name !== 'sales');
          if (name === 'sales') loadSales();
        });
      });
    })();
  </script>
</body>
</html>
