<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a Creator — PixelVault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar"><div class="container nav-inner">
    <a href="/" class="brand">PixelVault</a><div class="nav-links" id="nav-links"></div>
  </div></nav>
  <div class="container">
    <div class="form-card" style="max-width:560px">
      <h2>Become a <span>Creator</span></h2>
      <p style="color:var(--muted);margin-bottom:20px;font-size:0.9rem">
        Step 1 of 2 — create your account. After this, you'll submit your resume &amp; portfolio for admin review.
      </p>
      <div id="msg"></div>
      <form id="creator-form">
        <div class="form-group"><label>Full Name</label><input name="name" required /></div>
        <div class="form-row">
          <div class="form-group"><label>Username</label><input name="username" required /></div>
          <div class="form-group"><label>Phone</label><input name="phone" required /></div>
        </div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required /></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6" /></div>
        <button class="btn btn-primary btn-block" type="submit">Continue</button>
        <p class="form-footer">Already a creator? <a href="/login">Sign in</a></p>
      </form>
    </div>
  </div>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('creator-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('button');
      const msg = document.getElementById('msg');
      msg.innerHTML = ''; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating...';
      try {
        await api('/auth/creator/register', {
          method: 'POST',
          body: JSON.stringify({
            name: f.name.value, username: f.username.value, phone: f.phone.value,
            email: f.email.value, password: f.password.value,
          }),
        });
        location.href = '/pending';
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        btn.disabled = false; btn.textContent = 'Continue';
      }
    });
  </script>
</body>
</html>
