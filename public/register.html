<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — PixelVault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">PixelVault</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <div class="container">
    <form class="form-card" id="register-form">
      <h2>Create your account</h2>
      <div id="msg"></div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" required minlength="2" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required minlength="6" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
      <p class="form-footer">Have an account? <a href="/login">Sign in</a></p>
    </form>
  </div>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button');
      const msg = document.getElementById('msg');
      msg.innerHTML = '';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating...';

      try {
        await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: form.name.value,
            email: form.email.value,
            password: form.password.value,
          }),
        });
        location.href = '/dashboard';
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
