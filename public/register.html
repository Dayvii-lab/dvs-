<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — PixelVault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar"><div class="container nav-inner">
    <a href="/" class="brand">PixelVault</a><div class="nav-links" id="nav-links"></div>
  </div></nav>
  <div class="container">
    <form class="form-card" id="register-form">
      <h2>Create your <span>account</span></h2>
      <div id="msg"></div>
      <div class="form-group"><label>Full Name</label><input name="name" required /></div>
      <div class="form-row">
        <div class="form-group"><label>Username</label><input name="username" required /></div>
        <div class="form-group"><label>Phone</label><input name="phone" required placeholder="07XX XXX XXX" /></div>
      </div>
      <div class="form-group"><label>Email</label><input type="email" name="email" required /></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6" /></div>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
      <p class="form-footer">Have an account? <a href="/login">Sign in</a></p>
      <p class="form-footer">Want to sell? <a href="/creator-register">Apply as Creator</a></p>
    </form>
  </div>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('button');
      const msg = document.getElementById('msg');
      msg.innerHTML = ''; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating...';
      try {
        await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: f.name.value, username: f.username.value, phone: f.phone.value,
            email: f.email.value, password: f.password.value,
          }),
        });
        location.href = '/dashboard';
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
