<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — PixelVault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar"><div class="container nav-inner">
    <a href="/" class="brand">PixelVault</a>
    <div class="nav-links" id="nav-links"></div>
  </div></nav>

  <div class="container" style="padding:40px 24px">
    <h1 class="section-title">Admin <span>Panel</span></h1>

    <div id="auth-warning"></div>

    <div class="stats-grid" id="stats">
      <div class="loading">Checking access…</div>
    </div>

    <div class="tabs" id="tabs" style="display:none">
      <button class="tab active" data-tab="apps">Applications</button>
      <button class="tab" data-tab="creators">Creators</button>
      <button class="tab" data-tab="templates">Templates</button>
    </div>

    <div id="tab-apps" style="display:none"></div>
    <div id="tab-creators" style="display:none"></div>
    <div id="tab-templates" style="display:none"></div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // ---------------------------------------------------------------
    // Admin page bootstrap — with explicit auth diagnostics
    // ---------------------------------------------------------------
    (async () => {
      const statsBox   = document.getElementById('stats');
      const warningBox = document.getElementById('auth-warning');
      const tabsBar    = document.getElementById('tabs');
      const tabApps    = document.getElementById('tab-apps');
      const tabCreators= document.getElementById('tab-creators');
      const tabTemplates=document.getElementById('tab-templates');

      // 1. Auth check — with visible diagnostics
      let user = null;
      try {
        const me = await fetch('/api/auth/me', { credentials: 'include' });
        const data = await me.json().catch(() => ({}));
        console.log('[admin] /api/auth/me →', me.status, data);
        user = data.user || null;
      } catch (err) {
        console.error('[admin] auth check failed:', err);
      }

      if (!user) {
        warningBox.innerHTML = `<div class="alert alert-error">
          You are not logged in. Redirecting to login…
        </div>`;
        console.warn('[admin] No user session — redirecting to /login');
        setTimeout(() => { location.href = '/login'; }, 1200);
        statsBox.innerHTML = '';
        return;
      }

      if (user.role !== 'admin') {
        warningBox.innerHTML = `<div class="alert alert-error">
          You are logged in as <b>${escapeHtml(user.role)}</b> (${escapeHtml(user.email)}).
          Admin access required. Redirecting…
        </div>`;
        console.warn('[admin] Role is', user.role, '— not admin. Redirecting to /');
        setTimeout(() => { location.href = '/'; }, 2500);
        statsBox.innerHTML = '';
        return;
      }

      console.log('[admin] Logged in as admin:', user.email);

      // 2. Reveal UI now that we know we're authorized
      tabsBar.style.display = 'flex';
      tabApps.style.display = 'block';
      statsBox.innerHTML = '<div class="loading">Loading stats…</div>';

      // 3. Stats
      try {
        const s = await api('/admin/stats');
        statsBox.innerHTML = `
          <div class="stat-card"><div class="label">Customers</div><div class="value">${s.customers}</div></div>
          <div class="stat-card"><div class="label">Creators</div><div class="value">${s.creators}</div></div>
          <div class="stat-card"><div class="label">Templates</div><div class="value">${s.templates}</div></div>
          <div class="stat-card"><div class="label">Paid Orders</div><div class="value">${s.orders}</div></div>
          <div class="stat-card"><div class="label">Pending Apps</div><div class="value">${s.pendingApplications}</div></div>
          <div class="stat-card"><div class="label">Platform Revenue</div><div class="value">${formatKES(s.platformRevenue)}</div></div>
        `;
      } catch (err) {
        console.error('[admin] stats error:', err);
        statsBox.innerHTML = `<div class="alert alert-error">Stats failed: ${escapeHtml(err.message)}</div>`;
      }

      // 4. Applications (default tab)
      async function loadApps() {
        tabApps.innerHTML = '<div class="loading">Loading applications…</div>';
        try {
          const apps = await api('/applications');
          if (!apps.length) {
            tabApps.innerHTML = `<div class="empty">No applications yet.</div>`;
            return;
          }
          tabApps.innerHTML = apps.map(a => `
            <div class="panel">
              <div style="display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap">
                <div>
                  <h4>${escapeHtml(a.user?.name || 'Unknown')}
                    <span style="color:var(--muted);font-weight:400">@${escapeHtml(a.user?.username || '')}</span>
                  </h4>
                  <p style="color:var(--muted);font-size:0.85rem">
                    ${escapeHtml(a.user?.email || '')} · ${escapeHtml(a.user?.phone || '')}
                  </p>
                  <p style="margin-top:8px;white-space:pre-line">${escapeHtml(a.coverLetter || '')}</p>
                  ${a.experience ? `<p style="margin-top:8px;color:var(--muted);font-size:0.85rem"><b>Experience:</b> ${escapeHtml(a.experience)}</p>` : ''}
                  <p style="margin-top:10px;font-size:0.85rem">
                    <a href="/${a.resumePath}" target="_blank" rel="noopener" style="color:var(--primary)">View Resume</a> ·
                    <a href="/${a.portfolioPath}" target="_blank" rel="noopener" style="color:var(--primary)">View Portfolio</a>
                  </p>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;align-items:end">
                  <span class="badge badge-${a.status}">${a.status}</span>
                  ${a.status === 'pending' ? `
                    <button class="btn btn-success btn-sm" data-approve="${a._id}">Approve</button>
                    <button class="btn btn-danger btn-sm" data-reject="${a._id}">Reject</button>
                  ` : ''}
                </div>
              </div>
            </div>
          `).join('');

          tabApps.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async (e) => {
            const id = e.target.dataset.approve;
            e.target.disabled = true;
            e.target.innerHTML = '<span class="spinner"></span>';
            try {
              await api('/applications/' + id + '/approve', { method: 'POST' });
              loadApps();
            } catch (err) {
              alert('Approve failed: ' + err.message);
              e.target.disabled = false;
              e.target.textContent = 'Approve';
            }
          }));
          tabApps.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async (e) => {
            const id = e.target.dataset.reject;
            const note = prompt('Reason (optional):') || '';
            try {
              await api('/applications/' + id + '/reject', { method: 'POST', body: JSON.stringify({ note }) });
              loadApps();
            } catch (err) {
              alert('Reject failed: ' + err.message);
            }
          }));
        } catch (err) {
          console.error('[admin] loadApps error:', err);
          tabApps.innerHTML = `<div class="alert alert-error">Failed to load applications: ${escapeHtml(err.message)}</div>`;
        }
      }
      loadApps();

      // 5. Creators
      async function loadCreators() {
        tabCreators.innerHTML = '<div class="loading">Loading creators…</div>';
        try {
          const cs = await api('/admin/creators');
          if (!cs.length) {
            tabCreators.innerHTML = `<div class="empty">No creators yet.</div>`;
            return;
          }
          tabCreators.innerHTML = cs.map(c => `
            <div class="order-row">
              <div class="info">
                <h4>${escapeHtml(c.name)}
                  <span style="color:var(--muted);font-weight:400">@${escapeHtml(c.username)}</span>
                </h4>
                <p>${escapeHtml(c.email)} · ${escapeHtml(c.phone)}</p>
              </div>
              <span class="badge badge-${c.status}">${c.status}</span>
              <button class="btn btn-outline btn-sm" data-toggle="${c._id}">
                ${c.status === 'suspended' ? 'Reactivate' : 'Suspend'}
              </button>
            </div>
          `).join('');
          tabCreators.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', async (e) => {
            try {
              await api('/admin/creators/' + e.target.dataset.toggle + '/suspend', { method: 'POST' });
              loadCreators();
            } catch (err) {
              alert(err.message);
            }
          }));
        } catch (err) {
          console.error('[admin] loadCreators error:', err);
          tabCreators.innerHTML = `<div class="alert alert-error">Failed to load creators: ${escapeHtml(err.message)}</div>`;
        }
      }

      // 6. Templates
      async function loadTemplates() {
        tabTemplates.innerHTML = '<div class="loading">Loading templates…</div>';
        try {
          const ts = await api('/admin/templates');
          if (!ts.length) {
            tabTemplates.innerHTML = `<div class="empty">No templates.</div>`;
            return;
          }
          tabTemplates.innerHTML = ts.map(t => `
            <div class="order-row">
              <img src="${t.previewImage}" alt="" />
              <div class="info">
                <h4>${escapeHtml(t.title)}</h4>
                <p>By ${escapeHtml(t.creator?.name || '?')} · ${formatKES(t.price)} · ${t.sales} sales</p>
              </div>
              <span class="badge badge-${t.active ? 'active' : 'suspended'}">${t.active ? 'active' : 'hidden'}</span>
              <button class="btn btn-outline btn-sm" data-tog="${t._id}">
                ${t.active ? 'Hide' : 'Show'}
              </button>
            </div>
          `).join('');
          tabTemplates.querySelectorAll('[data-tog]').forEach(b => b.addEventListener('click', async (e) => {
            try {
              await api('/admin/templates/' + e.target.dataset.tog + '/toggle', { method: 'POST' });
              loadTemplates();
            } catch (err) {
              alert(err.message);
            }
          }));
        } catch (err) {
          console.error('[admin] loadTemplates error:', err);
          tabTemplates.innerHTML = `<div class="alert alert-error">Failed to load templates: ${escapeHtml(err.message)}</div>`;
        }
      }

      // 7. Tab switching
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const n = tab.dataset.tab;
          tabApps.style.display      = n === 'apps'      ? 'block' : 'none';
          tabCreators.style.display  = n === 'creators'  ? 'block' : 'none';
          tabTemplates.style.display = n === 'templates' ? 'block' : 'none';
          if (n === 'creators')  loadCreators();
          if (n === 'templates') loadTemplates();
        });
      });
    })();
  </script>
</body>
</html>
