<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — PixelVault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">PixelVault</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <div class="container">
    <form class="form-card" id="login-form">
      <h2>Welcome back</h2>
      <div id="msg"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign In</button>
      <p class="form-footer">No account? <a href="/register">Create one</a></p>
    </form>
  </div>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button');
      const msg = document.getElementById('msg');
      msg.innerHTML = '';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: form.email.value,
            password: form.password.value,
          }),
        });
        location.href = '/dashboard';
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
